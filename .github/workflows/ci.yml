name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Build themes and check contrast
        run: npm run build

      - name: Check generated themes are committed
        run: |
          git diff --exit-code -- themes/ || {
            echo "::error::themes/*.json is out of date. Run 'npm run build' and commit the result."
            exit 1
          }

      - name: Package
        run: npx --yes @vscode/vsce package

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'
